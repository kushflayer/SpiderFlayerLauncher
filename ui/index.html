<!doctype html>
<html lang="en" data-theme="oled">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spiderflayer Launcher</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>

  <div id="app">
    <nav id="rail" class="glass" aria-label="Main"></nav>

    <div id="main">
      <header id="top" class="glass" data-tauri-drag-region>
        <button class="icon-btn" id="back" aria-label="Back" title="Back"></button>
        <div id="crumb" data-tauri-drag-region></div>
        <div class="grow" data-tauri-drag-region></div>
        <div id="runstate"></div>
        <button class="icon-btn" id="bgbtn" aria-label="Change background" title="Change background"></button>
        <div class="wc">
          <button class="icon-btn" id="wmin" aria-label="Minimize"></button>
          <button class="icon-btn" id="wmax" aria-label="Maximize"></button>
          <button class="icon-btn close" id="wclose" aria-label="Close"></button>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <div id="progress" class="glass" hidden>
    <div class="p-msg"></div>
    <div class="bar"><i></i></div>
  </div>
  <div id="toasts"></div>
  <input type="file" id="bg-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <div id="drop" hidden><div>Drop an image to use it as your background<br><small>or a .mrpack file to import a modpack</small></div></div>
  <div id="modal-root"></div>

  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
