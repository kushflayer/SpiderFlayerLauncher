[package]
name = "spiderflayer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha1 = "0.10"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
urlencoding = "2"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
horizon-release-sign = { path = "../vendor/horizon-release-sign" }
tar = "0.4"
flate2 = "1"
